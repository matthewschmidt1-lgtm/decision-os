<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F5F5F0"/>
  <circle cx="90" cy="84" r="15" fill="#171717"/><circle cx="90" cy="84" r="6.5" fill="#F5F5F0"/>
  <text x="118" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#171717">Decision OS</text>
  <text x="88" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" letter-spacing="-2" fill="#171717">Real decisions.</text>
  <text x="88" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" letter-spacing="-2" fill="#171717">Real judgment.</text>
  <text x="88" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" letter-spacing="-2" fill="#171717">Better results.</text>
  <text x="88" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#7B7B76">Sales doesn't happen in spreadsheets.</text>
  <text x="88" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#7B7B76">It happens in moments. You make the call.</text>
  <text x="88" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#7B7B76">Then see <tspan font-weight="700" fill="#171717">why</tspan> it was the right one.</text>
  <rect x="88" y="568" width="160" height="6" rx="3" fill="#2457D6"/>
  <!-- practice card hint -->
  <rect x="790" y="150" width="330" height="330" rx="22" fill="#FBFBF8" stroke="#171717" stroke-opacity="0.1"/>
  <text x="818" y="190" font-family="Menlo, monospace" font-size="14" letter-spacing="1.5" fill="#7B7B76">THE DECISION</text>
  <text x="818" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#171717">What do you</text>
  <text x="818" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#171717">investigate first?</text>
  <rect x="818" y="280" width="274" height="42" rx="12" fill="#F5F5F0" stroke="#171717" stroke-opacity="0.12"/>
  <circle cx="840" cy="301" r="10" fill="none" stroke="#171717" stroke-opacity="0.3"/><text x="836" y="306" font-family="Menlo, monospace" font-size="11" fill="#7B7B76">A</text>
  <text x="862" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A4A46">Ask for more promotion</text>
  <rect x="818" y="332" width="274" height="42" rx="12" fill="#FBFBF8" stroke="#171717" stroke-width="2"/>
  <circle cx="840" cy="353" r="10" fill="#171717"/><text x="836" y="358" font-family="Menlo, monospace" font-size="11" fill="#F5F5F0">B</text>
  <text x="862" y="359" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#171717">Check distribution losses</text>
  <rect x="818" y="392" width="274" height="62" rx="12" fill="#2457D6" fill-opacity="0.1"/>
  <circle cx="838" cy="414" r="4" fill="#2457D6"/>
  <text x="852" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#171717">Good instinct. Diagnose</text>
  <text x="852" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#171717">before you prescribe.</text>
</svg>
